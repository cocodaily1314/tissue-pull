<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>紙巾挑戰 · 揀模式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    min-height: 100dvh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #F7F4EF;
    color: #3A3A3A;
    overscroll-behavior: none;
  }
  #wrap {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  #banner {
    text-align: center;
    padding: 28px 20px 12px;
  }
  #banner h1 {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #3D3D3D;
  }
  #banner .hook {
    font-size: 0.9rem;
    color: #9A948C;
    margin-top: 8px;
    font-weight: 500;
    line-height: 1.45;
  }
  .main {
    flex: 1;
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.mode-card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    background: #FFFCFA;
    border: 1.5px solid #E8E2DC;
    border-radius: 18px;
    padding: 18px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    min-height: 88px;
  }
  a.mode-card:active { transform: scale(0.98); }
  a.mode-card:hover {
    border-color: #C9B8A8;
    box-shadow: 0 6px 20px rgba(0,0,0,0.07);
  }
  .mode-card .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    flex-shrink: 0;
    background: #F0EBE4;
  }
  .mode-card .icon.sheets { background: #F2E6EA; }
  .mode-card .icon.roll { background: #EFE8DE; }
  .mode-card strong {
    display: block;
    font-size: 1.1rem;
    color: #3D3D3D;
    margin-bottom: 4px;
    font-weight: 800;
  }
  .mode-card span.desc {
    font-size: 0.82rem;
    color: #9A948C;
    line-height: 1.4;
  }
  .foot {
    text-align: center;
    font-size: 0.75rem;
    color: #B0AAA2;
    padding: 8px 16px 24px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="banner">
    <h1>紙巾挑戰</h1>
    <div class="hook">限時手速超休閒 · 揀一個開始玩</div>
  </div>
  <div class="main">
    <a class="mode-card" href="sheets.html">
      <span class="icon sheets" aria-hidden="true">📦</span>
      <span>
        <strong>抽紙挑戰 · 計張數</strong>
        <span class="desc">拖曳紙巾抽出，限時計張數</span>
      </span>
    </a>
    <a class="mode-card" href="roll.html">
      <span class="icon roll" aria-hidden="true">🧻</span>
      <span>
        <strong>卷紙挑戰 · 計長度</strong>
        <span class="desc">拖曳紙帶拉出，限時計 cm</span>
      </span>
    </a>
  </div>
  <p class="foot">Three.js · 手機全螢幕 · 結果圖可分享</p>
</div>
</body>
</html>
