<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF6B9D">
<title>抽啊抽 · 紙巾挑戰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #FFF5EB;
    color: #3D2914;
    overscroll-behavior: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #FFE8D6 0%, #FFF5EB 38%, #FFEFD9 100%);
    box-shadow: 0 0 40px rgba(180,100,60,0.12);
  }
  #banner {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #FF6B9D 0%, #FF8FB5 50%, #FF6B9D 100%);
    color: #fff;
    text-align: center;
    padding: 12px 16px 14px;
    box-shadow: 0 4px 16px rgba(255,107,157,0.35);
    z-index: 5;
  }
  #banner h1 {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.1);
  }
  #banner .hook {
    font-size: 0.82rem;
    opacity: 0.95;
    margin-top: 4px;
    font-weight: 500;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255,180,140,0.35);
    z-index: 4;
  }
  #hud.hidden { visibility: hidden; height: 0; padding: 0; overflow: hidden; border: none; }
  #hud .pill {
    background: #fff;
    border-radius: 999px;
    padding: 4px 12px;
    box-shadow: 0 2px 6px rgba(180,100,60,0.1);
  }
  #hud .acc { color: #E85A8A; }
  #hud .score { color: #C45C26; }
  #bigStat {
    flex: 0 0 auto;
    text-align: center;
    padding: 6px 12px 2px;
    z-index: 3;
  }
  #bigStat.hidden { display: none; }
  #bigStat .num {
    font-size: 3.4rem;
    font-weight: 900;
    line-height: 1;
    color: #E85A8A;
    letter-spacing: -0.02em;
    text-shadow: 0 3px 0 rgba(255,180,200,0.45);
    font-variant-numeric: tabular-nums;
  }
  #bigStat .unit {
    font-size: 1rem;
    font-weight: 700;
    color: #C45C26;
    margin-top: 2px;
  }
  #canvasBox {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas#game:active { cursor: grabbing; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(61,41,20,0.45);
    z-index: 10;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: #FFF9F2;
    border-radius: 20px;
    padding: 22px 20px 18px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(61,41,20,0.25);
    border: 2px solid #FFE0C2;
  }
  .card h2 {
    font-size: 1.35rem;
    margin-bottom: 6px;
    color: #C45C26;
  }
  .card .sub {
    font-size: 0.88rem;
    color: #8B6B4A;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .mode-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    width: 100%;
    border: 2px solid #FFD0A8;
    background: #fff;
    border-radius: 16px;
    padding: 14px 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    box-shadow: 0 2px 8px rgba(180,100,60,0.08);
  }
  .mode-btn:active { transform: scale(0.98); }
  .mode-btn:hover { border-color: #FF6B9D; box-shadow: 0 4px 14px rgba(255,107,157,0.2); }
  .mode-btn .emoji {
    font-size: 2rem;
    width: 48px;
    text-align: center;
    flex-shrink: 0;
  }
  .mode-btn .info { flex: 1; min-width: 0; }
  .mode-btn .info strong {
    display: block;
    font-size: 1.05rem;
    color: #C45C26;
    margin-bottom: 2px;
  }
  .mode-btn .info span {
    font-size: 0.78rem;
    color: #8B6B4A;
    line-height: 1.35;
  }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    margin: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #FF6B9D, #FF8A5B);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,107,157,0.4);
  }
  .btn-secondary {
    background: #fff;
    color: #C45C26;
    border: 2px solid #FFD0A8;
    box-shadow: 0 2px 8px rgba(180,100,60,0.1);
  }
  #resultScreen { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 360px; }
  #resultScreen.show { display: flex; }
  #resultCanvas {
    width: 100%;
    max-width: 320px;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(61,41,20,0.2);
    background: #FFF9F2;
  }
  .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.95);
    text-align: center;
    margin-top: 2px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  #floatMsg {
    position: absolute;
    left: 50%;
    top: 22%;
    transform: translate(-50%, 0);
    font-size: 1.35rem;
    font-weight: 800;
    color: #FF6B9D;
    text-shadow: 0 2px 8px rgba(255,255,255,0.9);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    transition: opacity 0.2s, transform 0.4s;
    white-space: nowrap;
  }
  #floatMsg.show {
    opacity: 1;
    transform: translate(-50%, -20px);
  }
  #controlsHint {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.78rem;
    color: #A07858;
    opacity: 0.9;
    pointer-events: none;
    z-index: 3;
    font-weight: 600;
  }
  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8;
    pointer-events: none;
    font-size: 5rem;
    font-weight: 900;
    color: #E85A8A;
    text-shadow: 0 4px 0 rgba(255,180,200,0.5), 0 0 40px rgba(255,255,255,0.8);
  }
  #countdown.show { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="banner">
    <h1 id="bannerTitle">抽啊抽 · 紙巾挑戰</h1>
    <div class="hook" id="bannerHook">限時狂抽定捲到盡？揀模式見真章！</div>
  </div>
  <div id="hud" class="hidden">
    <span class="pill score">時間 <span id="timeEl">18.0</span>s</span>
    <span class="pill acc">速率 <span id="rateEl">0</span></span>
  </div>
  <div id="bigStat" class="hidden">
    <div class="num" id="statNum">0</div>
    <div class="unit" id="statUnit">張</div>
  </div>
  <div id="canvasBox">
    <canvas id="game"></canvas>
    <div id="floatMsg"></div>
    <div id="countdown"></div>
    <div id="controlsHint"></div>
  </div>
  <div id="overlay">
    <div class="card" id="menuCard">
      <h2>準備好未？🧻</h2>
      <p class="sub">奶油風超休閒 · 手速見真章 · 結果圖可分享 Threads</p>
      <div class="mode-grid">
        <button class="mode-btn" id="modeABtn" type="button">
          <span class="emoji">📦</span>
          <span class="info">
            <strong>Mode A · 抽紙巾計張數</strong>
            <span>向上掃／拖，限時抽出最多張紙巾</span>
          </span>
        </button>
        <button class="mode-btn" id="modeBBtn" type="button">
          <span class="emoji">🧻</span>
          <span class="info">
            <strong>Mode B · 卷紙計長度</strong>
            <span>拖曳開卷，限時拉出最長捲紙</span>
          </span>
        </button>
      </div>
    </div>
    <div id="resultScreen">
      <canvas id="resultCanvas" width="360" height="640"></canvas>
      <div class="result-actions">
        <button class="btn btn-primary" id="dlBtn" type="button">下載結果圖</button>
        <button class="btn btn-secondary" id="retryBtn" type="button">再玩一次</button>
        <button class="btn btn-secondary" id="menuBtn" type="button">返主選單</button>
      </div>
      <p class="hint">💡 下載結果圖後分享去 Threads，挑戰朋友手速！</p>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  const ROUND_SEC = 18;
  const SHEET_PULL_PX = 72;
  const CM_PER_PX = 0.05;

  const HOOKS = {
    menu: '限時狂抽定捲到盡？揀模式見真章！',
    A: '一抽一張，手速見真章！限時狂抽睇你幾快手！',
    B: '捲啊捲！拖曳開卷，睇你拉得出幾長！',
  };
  const TITLES = {
    menu: '抽啊抽 · 紙巾挑戰',
    A: '抽紙巾計張數 📦',
    B: '卷紙計長度 🧻',
  };

  function gradeSheets(n) {
    if (n <= 0) return { title: '紙都未郁', emoji: '😶', color: '#A07858' };
    if (n <= 8) return { title: '手殘紙奴', emoji: '😅', color: '#A07858' };
    if (n <= 18) return { title: '街坊抽紙手', emoji: '🙂', color: '#C45C26' };
    if (n <= 32) return { title: '急症室級', emoji: '🏥', color: '#E85A8A' };
    if (n <= 50) return { title: '紙巾粉碎機', emoji: '🌪️', color: '#FF6B9D' };
    if (n <= 75) return { title: '全家裝清貨王', emoji: '👑', color: '#D4A017' };
    return { title: '紙巾之神', emoji: '✨', color: '#D4A017' };
  }
  function gradeLength(cm) {
    if (cm < 30) return { title: '抹嘴都唔夠', emoji: '🫠', color: '#A07858' };
    if (cm < 100) return { title: '街坊衛生標兵', emoji: '🙂', color: '#C45C26' };
    if (cm < 250) return { title: '廁紙刺客', emoji: '🥷', color: '#E85A8A' };
    if (cm < 500) return { title: '捲紙馬拉松', emoji: '🏃', color: '#FF6B9D' };
    if (cm < 900) return { title: '連卷大王', emoji: '👑', color: '#D4A017' };
    return { title: '廁紙傳說', emoji: '🧻✨', color: '#D4A017' };
  }

  function formatLength(cm) {
    if (cm >= 100) {
      const m = cm / 100;
      return { main: m >= 10 ? m.toFixed(1) : m.toFixed(2), unit: 'm', rawCm: cm };
    }
    return { main: cm < 10 ? cm.toFixed(1) : String(Math.round(cm)), unit: 'cm', rawCm: cm };
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const menuCard = document.getElementById('menuCard');
  const resultScreen = document.getElementById('resultScreen');
  const resultCanvas = document.getElementById('resultCanvas');
  const timeEl = document.getElementById('timeEl');
  const rateEl = document.getElementById('rateEl');
  const hud = document.getElementById('hud');
  const bigStat = document.getElementById('bigStat');
  const statNum = document.getElementById('statNum');
  const statUnit = document.getElementById('statUnit');
  const floatMsg = document.getElementById('floatMsg');
  const controlsHint = document.getElementById('controlsHint');
  const countdownEl = document.getElementById('countdown');
  const bannerTitle = document.getElementById('bannerTitle');
  const bannerHook = document.getElementById('bannerHook');

  let W = 0, H = 0, dpr = 1;
  let phase = 'menu';
  let mode = null;
  let sheets = 0;
  let lengthCm = 0;
  let timeLeft = ROUND_SEC;
  let startTs = 0;
  let animId = null;
  let floatTimer = null;
  let particles = [];
  let flyingSheets = [];
  let shake = 0;

  let dragging = false;
  let lastX = 0, lastY = 0;
  let pullProgress = 0;
  let pullVisual = 0;
  let rollAngle = 0;
  let paperWave = 0;
  let comboFlash = 0;
  let boxBob = 0;
  let paperTrail = 40;
  let countdownTimer = null;

  function resize() {
    const box = document.getElementById('canvasBox');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.clientWidth;
    H = box.clientHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function clientToCanvas(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (phase !== 'playing') return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    dragging = true;
    const p = clientToCanvas(e);
    lastX = p.x; lastY = p.y;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragging || phase !== 'playing') return;
    e.preventDefault();
    const p = clientToCanvas(e);
    const dx = p.x - lastX;
    const dy = p.y - lastY;
    lastX = p.x; lastY = p.y;

    if (mode === 'A') {
      if (dy < 0) {
        const up = -dy;
        pullProgress += up;
        pullVisual = Math.min(SHEET_PULL_PX * 1.2, pullVisual + up);
        while (pullProgress >= SHEET_PULL_PX) {
          pullProgress -= SHEET_PULL_PX;
          completeSheet();
        }
      } else if (dy > 0) {
        pullProgress = Math.max(0, pullProgress - dy * 0.35);
        pullVisual = Math.max(0, pullVisual - dy * 0.5);
      }
    } else if (mode === 'B') {
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        lengthCm += dist * CM_PER_PX;
        rollAngle += dist * 0.045;
        paperTrail = Math.min(H * 0.55, paperTrail + dist * 0.35);
        paperWave += dist * 0.08;
        spawnPaperBits(p.x, p.y);
        updateStatDisplay();
      }
    }
  });

  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function completeSheet() {
    sheets++;
    comboFlash = 1;
    boxBob = 1;
    const cx = W / 2;
    const boxTop = H * 0.55;
    flyingSheets.push({
      x: cx + (Math.random() - 0.5) * 30,
      y: boxTop - 20 - pullVisual * 0.3,
      vy: -6 - Math.random() * 4,
      vx: (Math.random() - 0.5) * 3,
      rot: (Math.random() - 0.5) * 0.6,
      vr: (Math.random() - 0.5) * 0.15,
      life: 1,
      w: 70 + Math.random() * 16,
      h: 28 + Math.random() * 8,
    });
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: boxTop - 10,
        vx: (Math.random() - 0.5) * 5,
        vy: -2 - Math.random() * 4,
        life: 1,
        color: Math.random() > 0.5 ? '#FF8FB5' : '#fff',
        r: 2 + Math.random() * 3,
      });
    }
    pullVisual = Math.max(0, pullVisual - SHEET_PULL_PX * 0.55);
    if (sheets % 10 === 0) showFloat(sheets + ' 張！🔥', '#FF6B9D');
    else if (sheets % 5 === 0) showFloat('繼續抽！', '#FF8A5B');
    updateStatDisplay();
    shake = Math.min(8, shake + 2);
  }

  function spawnPaperBits(x, y) {
    if (Math.random() > 0.35) return;
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 0.6 + Math.random() * 0.4,
      color: '#FFF8F0',
      r: 1.5 + Math.random() * 2.5,
    });
  }

  function showFloat(text, color) {
    floatMsg.textContent = text;
    floatMsg.style.color = color || '#FF6B9D';
    floatMsg.classList.add('show');
    clearTimeout(floatTimer);
    floatTimer = setTimeout(() => floatMsg.classList.remove('show'), 650);
  }

  function updateStatDisplay() {
    if (mode === 'A') {
      statNum.textContent = String(sheets);
      statUnit.textContent = '張';
      const elapsed = Math.max(0.001, ROUND_SEC - timeLeft);
      rateEl.textContent = (sheets / elapsed).toFixed(1) + '/秒';
    } else if (mode === 'B') {
      const f = formatLength(lengthCm);
      statNum.textContent = f.main;
      statUnit.textContent = f.unit;
      const elapsed = Math.max(0.001, ROUND_SEC - timeLeft);
      const rateCm = lengthCm / elapsed;
      rateEl.textContent = rateCm >= 100
        ? (rateCm / 100).toFixed(2) + ' m/秒'
        : rateCm.toFixed(1) + ' cm/秒';
    }
    timeEl.textContent = Math.max(0, timeLeft).toFixed(1);
  }

  function setBanner(m) {
    bannerTitle.textContent = TITLES[m];
    bannerHook.textContent = HOOKS[m];
  }

  function showMenu() {
    phase = 'menu';
    mode = null;
    setBanner('menu');
    hud.classList.add('hidden');
    bigStat.classList.add('hidden');
    controlsHint.textContent = '';
    menuCard.style.display = '';
    resultScreen.classList.remove('show');
    overlay.classList.remove('hidden');
    countdownEl.classList.remove('show');
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
  }

  function startMode(m) {
    mode = m;
    setBanner(m);
    sheets = 0;
    lengthCm = 0;
    pullProgress = 0;
    pullVisual = 0;
    rollAngle = 0;
    paperTrail = 40;
    paperWave = 0;
    particles = [];
    flyingSheets = [];
    shake = 0;
    comboFlash = 0;
    boxBob = 0;
    timeLeft = ROUND_SEC;
    dragging = false;
    updateStatDisplay();
    menuCard.style.display = 'none';
    resultScreen.classList.remove('show');
    overlay.classList.add('hidden');
    hud.classList.remove('hidden');
    bigStat.classList.remove('hidden');
    controlsHint.textContent = m === 'A'
      ? '↑ 向上掃／拖抽出紙巾'
      : '↔ 拖曳開卷，拉得越遠越長';

    phase = 'countdown';
    let count = 3;
    countdownEl.classList.add('show');
    countdownEl.textContent = '3';
    if (countdownTimer) clearTimeout(countdownTimer);
    function tick() {
      count--;
      if (count > 0) {
        countdownEl.textContent = String(count);
        countdownTimer = setTimeout(tick, 500);
      } else if (count === 0) {
        countdownEl.textContent = '開始！';
        countdownTimer = setTimeout(() => {
          countdownEl.classList.remove('show');
          phase = 'playing';
          startTs = performance.now();
          timeLeft = ROUND_SEC;
          countdownTimer = null;
        }, 350);
      }
    }
    countdownTimer = setTimeout(tick, 500);
  }

  function endRound() {
    phase = 'result';
    dragging = false;
    controlsHint.textContent = '';
    const elapsed = ROUND_SEC;
    let grade, primary, secondary;
    if (mode === 'A') {
      grade = gradeSheets(sheets);
      primary = sheets + ' 張';
      secondary = '速率 ' + (sheets / elapsed).toFixed(1) + ' 張/秒';
    } else {
      grade = gradeLength(lengthCm);
      const f = formatLength(lengthCm);
      primary = f.main + ' ' + f.unit;
      const rateCm = lengthCm / elapsed;
      const rateStr = rateCm >= 100
        ? (rateCm / 100).toFixed(2) + ' m/秒'
        : rateCm.toFixed(1) + ' cm/秒';
      secondary = '速率 ' + rateStr;
    }
    drawResultCard(grade, primary, secondary);
    menuCard.style.display = 'none';
    resultScreen.classList.add('show');
    overlay.classList.remove('hidden');
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawResultCard(grade, primary, secondary) {
    const rc = resultCanvas;
    const rctx = rc.getContext('2d');
    const RW = rc.width, RH = rc.height;

    const g = rctx.createLinearGradient(0, 0, 0, RH);
    g.addColorStop(0, '#FFE8D6');
    g.addColorStop(0.45, '#FFF5EB');
    g.addColorStop(1, '#FFEFD9');
    rctx.fillStyle = g;
    rctx.fillRect(0, 0, RW, RH);

    const bg = rctx.createLinearGradient(0, 0, RW, 0);
    bg.addColorStop(0, '#FF6B9D');
    bg.addColorStop(0.5, '#FF8FB5');
    bg.addColorStop(1, '#FF6B9D');
    rctx.fillStyle = bg;
    roundRect(rctx, 24, 28, RW - 48, 88, 18);
    rctx.fill();
    rctx.fillStyle = '#fff';
    rctx.textAlign = 'center';
    rctx.font = '800 22px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText(mode === 'A' ? '抽紙巾計張數' : '卷紙計長度', RW / 2, 62);
    rctx.font = '500 13px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText(mode === 'A' ? '一抽一張，手速見真章！' : '捲啊捲！睇你拉得出幾長！', RW / 2, 88);

    rctx.fillStyle = '#E85A8A';
    rctx.font = '900 56px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText(primary, RW / 2, 210);

    rctx.fillStyle = '#C45C26';
    rctx.font = '700 18px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText(secondary, RW / 2, 248);

    rctx.save();
    rctx.translate(RW / 2, 360);
    if (mode === 'A') drawTissueBox(rctx, 0, 0, 1.15, 0, 0.3);
    else drawToiletRoll(rctx, 0, 0, 1.2, rollAngle, Math.min(120, paperTrail * 0.4));
    rctx.restore();

    roundRect(rctx, 50, 455, RW - 100, 78, 16);
    rctx.fillStyle = '#fff';
    rctx.fill();
    rctx.strokeStyle = '#FFD0A8';
    rctx.lineWidth = 2;
    rctx.stroke();
    rctx.fillStyle = grade.color;
    rctx.font = '800 26px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText(grade.emoji + ' ' + grade.title, RW / 2, 502);

    rctx.fillStyle = '#A07858';
    rctx.font = '600 14px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText('抽啊抽 · 紙巾挑戰', RW / 2, 575);
    rctx.font = '500 12px "PingFang TC","Noto Sans TC",sans-serif';
    rctx.fillText('限時 ' + ROUND_SEC + ' 秒 · 分享挑戰朋友！', RW / 2, 598);
  }

  function drawTissueBox(c, x, y, scale, bob, pullAmt) {
    c.save();
    c.translate(x, y + Math.sin(bob * Math.PI) * -6);
    c.scale(scale, scale);
    const bw = 130, bh = 70;
    c.fillStyle = 'rgba(180,100,60,0.15)';
    c.beginPath();
    c.ellipse(0, bh / 2 + 10, bw / 2 + 8, 12, 0, 0, Math.PI * 2);
    c.fill();
    const boxG = c.createLinearGradient(-bw / 2, -bh / 2, bw / 2, bh / 2);
    boxG.addColorStop(0, '#FFF0F5');
    boxG.addColorStop(0.5, '#FFD6E7');
    boxG.addColorStop(1, '#FFB6D0');
    c.fillStyle = boxG;
    roundRect(c, -bw / 2, -bh / 2, bw, bh, 10);
    c.fill();
    c.strokeStyle = '#FF8FB5';
    c.lineWidth = 2.5;
    c.stroke();
    c.fillStyle = '#5A3A2A';
    c.beginPath();
    c.ellipse(0, -bh / 2 + 6, 42, 12, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#3D2914';
    c.beginPath();
    c.ellipse(0, -bh / 2 + 6, 34, 8, 0, 0, Math.PI * 2);
    c.fill();
    const lift = 8 + pullAmt * 0.55;
    c.fillStyle = '#FFFBF5';
    c.strokeStyle = '#E8D5C4';
    c.lineWidth = 1.2;
    roundRect(c, -28, -bh / 2 - lift, 56, 18 + lift * 0.3, 4);
    c.fill();
    c.stroke();
    c.strokeStyle = 'rgba(200,160,140,0.5)';
    c.beginPath();
    c.moveTo(-20, -bh / 2 - lift + 8);
    c.quadraticCurveTo(0, -bh / 2 - lift + 4, 20, -bh / 2 - lift + 8);
    c.stroke();
    c.fillStyle = '#E85A8A';
    c.font = '800 14px "PingFang TC",sans-serif';
    c.textAlign = 'center';
    c.fillText('柔柔紙巾', 0, 8);
    c.font = '600 9px "PingFang TC",sans-serif';
    c.fillStyle = '#C45C26';
    c.fillText('SOFT PULL', 0, 22);
    c.restore();
  }

  function drawToiletRoll(c, x, y, scale, angle, trail) {
    c.save();
    c.translate(x, y);
    c.scale(scale, scale);
    const hang = Math.max(20, trail || 40);
    c.fillStyle = '#FFFBF5';
    c.strokeStyle = '#E8D5C4';
    c.lineWidth = 1.5;
    c.beginPath();
    const waves = 4;
    for (let i = 0; i <= waves; i++) {
      const t = i / waves;
      const py = t * hang;
      const px = 40 + Math.sin(paperWave * 0.5 + t * 4) * (6 + t * 10);
      if (i === 0) c.moveTo(px, 0);
      else c.lineTo(px, py);
    }
    c.lineTo(4 + Math.sin(paperWave * 0.5 + 4) * 8, hang);
    for (let i = waves; i >= 0; i--) {
      const t = i / waves;
      const py = t * hang;
      const px = 4 + Math.sin(paperWave * 0.5 + t * 4) * (6 + t * 10);
      c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.stroke();
    c.strokeStyle = 'rgba(200,160,140,0.45)';
    c.setLineDash([3, 4]);
    for (let i = 1; i < 3; i++) {
      const py = (hang / 3) * i;
      c.beginPath();
      c.moveTo(8, py);
      c.lineTo(36, py);
      c.stroke();
    }
    c.setLineDash([]);

    c.save();
    c.rotate(angle * 0.15);
    const rg = c.createLinearGradient(-50, -35, 50, 35);
    rg.addColorStop(0, '#FFF8F0');
    rg.addColorStop(0.4, '#FFFBF5');
    rg.addColorStop(1, '#F0E0D0');
    c.fillStyle = rg;
    c.beginPath();
    c.ellipse(0, 0, 48, 36, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#E0C8B0';
    c.lineWidth = 2;
    c.stroke();
    c.strokeStyle = 'rgba(200,160,140,0.35)';
    c.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.ellipse(0, 0, 48 - i * 7, 36 - i * 5, angle * 0.1 + i * 0.3, 0, Math.PI * 2);
      c.stroke();
    }
    c.fillStyle = '#D4A574';
    c.beginPath();
    c.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#C4925C';
    c.beginPath();
    c.ellipse(0, 0, 9, 7, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
    c.restore();
  }

  function drawFlyingSheet(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = '#FFFBF5';
    ctx.strokeStyle = '#E8D5C4';
    ctx.lineWidth = 1.2;
    roundRect(ctx, -s.w / 2, -s.h / 2, s.w, s.h, 3);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,160,140,0.4)';
    ctx.beginPath();
    ctx.moveTo(-s.w / 2 + 6, 0);
    ctx.quadraticCurveTo(0, -4, s.w / 2 - 6, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawScene(dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(W / 2, H * 0.88, W * 0.38, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(sx, sy);

    if (mode === 'B' && phase !== 'menu') {
      drawToiletRoll(ctx, W / 2, H * 0.38, Math.min(1.35, W / 280), rollAngle, paperTrail);
      if (!dragging && phase === 'playing') {
        paperTrail = Math.max(30, paperTrail - dt * 12);
      }
    } else if (mode === 'A' && phase !== 'menu') {
      drawTissueBox(ctx, W / 2, H * 0.58, Math.min(1.45, W / 260), boxBob, pullVisual);
      if (!dragging) {
        pullVisual += (pullProgress * 0.4 - pullVisual) * Math.min(1, dt * 6);
      } else {
        pullVisual += (Math.min(SHEET_PULL_PX * 1.15, pullProgress + 10) - pullVisual) * Math.min(1, dt * 10);
      }
    } else if (phase === 'menu') {
      const t = performance.now() / 1000;
      drawTissueBox(ctx, W / 2 - 70, H * 0.42, 0.85, (Math.sin(t) + 1) / 2, 8 + Math.sin(t * 2) * 6);
      drawToiletRoll(ctx, W / 2 + 80, H * 0.38, 0.75, t * 0.8, 50 + Math.sin(t) * 10);
    }

    for (const s of flyingSheets) drawFlyingSheet(s);
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (mode === 'A' && phase === 'playing' && pullProgress > 2) {
      const pct = Math.min(1, pullProgress / SHEET_PULL_PX);
      ctx.strokeStyle = 'rgba(232,90,138,0.35)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(W / 2, H * 0.58 - 55, 22, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    if (comboFlash > 0) {
      ctx.fillStyle = 'rgba(255,107,157,' + (comboFlash * 0.12) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function update(dt) {
    if (phase === 'playing') {
      const elapsed = (performance.now() - startTs) / 1000;
      timeLeft = Math.max(0, ROUND_SEC - elapsed);
      updateStatDisplay();
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateStatDisplay();
        endRound();
      }
    }
    for (let i = flyingSheets.length - 1; i >= 0; i--) {
      const s = flyingSheets[i];
      s.x += s.vx; s.y += s.vy; s.vy += 18 * dt; s.rot += s.vr; s.life -= dt * 0.85;
      if (s.life <= 0 || s.y > H + 40) flyingSheets.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 10 * dt; p.life -= dt * 1.2;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (comboFlash > 0) comboFlash = Math.max(0, comboFlash - dt * 3);
    if (boxBob > 0) boxBob = Math.max(0, boxBob - dt * 4);
  }

  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    update(dt);
    drawScene(dt);
    animId = requestAnimationFrame(loop);
  }

  document.getElementById('modeABtn').addEventListener('click', () => startMode('A'));
  document.getElementById('modeBBtn').addEventListener('click', () => startMode('B'));
  document.getElementById('retryBtn').addEventListener('click', () => { if (mode) startMode(mode); });
  document.getElementById('menuBtn').addEventListener('click', showMenu);
  document.getElementById('dlBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.download = (mode === 'A' ? 'tissue-sheets-' : 'paper-length-') + stamp + '.png';
    a.href = resultCanvas.toDataURL('image/png');
    a.click();
  });

  // Expose for smoke tests
  window.__tissuePull = {
    startMode, showMenu, endRound,
    getState: () => ({ phase, mode, sheets, lengthCm, timeLeft, pullProgress }),
    injectPull: (px) => {
      if (mode !== 'A' || phase !== 'playing') return;
      pullProgress += px;
      while (pullProgress >= SHEET_PULL_PX) {
        pullProgress -= SHEET_PULL_PX;
        completeSheet();
      }
    },
    injectDrag: (px) => {
      if (mode !== 'B' || phase !== 'playing') return;
      lengthCm += px * CM_PER_PX;
      rollAngle += px * 0.045;
      paperTrail = Math.min(H * 0.55, paperTrail + px * 0.35);
      updateStatDisplay();
    },
    forcePlay: () => {
      if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
      countdownEl.classList.remove('show');
      phase = 'playing';
      startTs = performance.now();
      timeLeft = ROUND_SEC;
    },
    ROUND_SEC, SHEET_PULL_PX, CM_PER_PX,
  };

  resize();
  showMenu();
  animId = requestAnimationFrame(loop);
})();

</script>
</body>
</html>
